plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group_id
version = mod_version
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '**/.cache/**'

def filmProfile = providers.gradleProperty('overprotocolFilmProfile').getOrElse('')
if (!(filmProfile in ['', 'replay', 'camera'])) {
    throw new GradleException('overprotocolFilmProfile must be replay or camera.')
}

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = '2024.11.17'
    }
    runs {
        client {
            client()
            gameDirectory = file(filmProfile ? "run-film/${filmProfile}" : 'run-client')
            jvmArgument "-Doverprotocol.b2.modelExport=${file('art/b2-spirit.obj').absolutePath}"
            if (filmProfile) {
                programArguments.addAll '--width', '1920', '--height', '1080'
            }
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        overprotocol { sourceSet sourceSets.main }
    }
}

dependencyLocking { lockAllConfigurations() }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('processResources', ProcessResources) {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                    neo_version: neo_version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-${mod_version}+NeoForge${minecraft_version}-Hotfix0.jar"
    // Development-only GameTests and templates stay out of the release mod.
    exclude 'dev/overprotocol/gametest/**'
    exclude 'data/overprotocol/structure/test_empty.nbt'
}

// Export the actual procedural mesh for modelling checks without launching Minecraft.
tasks.register('exportB2Model', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    mainClass = 'dev.overprotocol.client.B2Mesh'
    args file('art/b2-spirit.obj').absolutePath
}
